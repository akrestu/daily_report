<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Offline — SiGAP</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        /* Halaman mandiri (precache service worker): nilai warna = token design system (resources/css/tokens.css) */
        :root { --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --muted: #5E6B7F; --border: #E2E8F0; --primary: #111111; --on-primary: #FFFFFF; --accent-tint: #FEF6CC; --accent-border: #EBD679; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0B1120; --surface: #111A2E; --text: #F1F5F9; --muted: #9AA8BD; --border: #26324A; --primary: #F5D334; --on-primary: #111111; --accent-tint: #2E2706; --accent-border: #5C4D10; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
            font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; text-align: center; }
        .logo { width: 64px; height: 64px; }
        h1 { font-size: 22px; margin: 16px 0 6px; }
        p { margin: 0 0 16px; color: var(--muted); }
        .note { text-align: left; background: var(--accent-tint); border: 1px solid var(--accent-border); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--text); margin-bottom: 20px; }
        .note ul { margin: 6px 0 0; padding-left: 18px; }
        button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; cursor: pointer; }
        button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
        .status { margin-top: 12px; font-size: 14px; color: var(--muted); }
        .status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #DC2626; vertical-align: middle; }
        .status.online::before { background: #16A34A; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/icons/icon-192x192.png?v=5" alt="SiGAP">
        <h1>Anda sedang offline</h1>
        <p>Halaman ini belum tersimpan di perangkat. Coba lagi saat sinyal kembali.</p>
        <div class="note">
            <strong>Tetap bisa dilakukan:</strong>
            <ul>
                <li>Membuka halaman yang pernah Anda buka sebelumnya.</li>
                <li>Mengisi <strong>Buat Laporan</strong> — laporan disimpan di perangkat dan terkirim otomatis saat online.</li>
            </ul>
        </div>
        <button type="button" onclick="location.reload()">Coba lagi</button>
        <div class="status" id="status" role="status" aria-live="polite">Tidak ada koneksi internet</div>
    </main>
    <script>
        const status = document.getElementById('status');
        function update() {
            status.classList.toggle('online', navigator.onLine);
            status.textContent = navigator.onLine ? 'Koneksi kembali — memuat ulang…' : 'Tidak ada koneksi internet';
        }
        window.addEventListener('offline', update);
        window.addEventListener('online', () => { update(); setTimeout(() => location.reload(), 800); });
        update();
    </script>
</body>
</html>
